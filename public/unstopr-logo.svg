<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" fill="none">
  <!-- Unstopr Logo Mark -->
  <g fill="#1A70FF">
    <!-- Col 1: Small dots -->
    <rect x="12" y="24" width="8" height="8" rx="1"/>
    <rect x="12" y="46" width="8" height="8" rx="1"/>
    <rect x="12" y="68" width="8" height="8" rx="1"/>

    <!-- Col 2: Medium squares -->
    <rect x="30" y="16" width="12" height="12" rx="1.5"/>
    <rect x="30" y="36" width="12" height="12" rx="1.5"/>
    <rect x="30" y="56" width="12" height="12" rx="1.5"/>
    <rect x="30" y="76" width="12" height="12" rx="1.5"/>

    <!-- Col 3: Horizontal bars -->
    <rect x="52" y="15" width="34" height="15" rx="2"/>
    <rect x="52" y="42" width="34" height="15" rx="2"/>
    <rect x="52" y="69" width="34" height="15" rx="2"/>

    <!-- Col 4: Vertical bar -->
    <rect x="94" y="24" width="12" height="51" rx="2"/>

    <!-- Col 5: Right Triangle Arrow -->
    <path d="M 116 26 L 138 50 L 116 74 Z" />
  </g>

  <!-- Unstopr Brand Name Text -->
  <text x="152" y="68" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5" fill="#080D1A">Unstopr</text>
</svg>
